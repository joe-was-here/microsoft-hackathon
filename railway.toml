[build]
builder = "NIXPACKS"
buildCommand = "if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; else pip install -r requirements.txt; fi"

[deploy]
startCommand = "if [ -d backend ]; then cd backend; fi; uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10